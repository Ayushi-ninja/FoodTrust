; ==============================================================================
; FoodTrust — ESP32 Smart Food Waste Monitoring & Redistribution Firmware
; PlatformIO Configuration
; Target Microcontroller: ESP32-WROOM-32 / ESP32-DevKitC
; Framework: Arduino
; ==============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ ~6.5.0
board = esp32dev
framework = arduino

; Serial Monitor & Upload Configuration
monitor_speed = 115200
upload_speed = 921600

; Library Dependencies:
; - ArduinoJson: High-efficiency JSON parsing and serialization (v7.x)
; - DHT sensor library: Temp & humidity probe reader
; - Adafruit Unified Sensor: Base sensor abstraction
; - HX711: 24-bit ADC amplifier interface for tray load cell strain gauges
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bogde/HX711 @ ^0.7.5

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
