<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Donor Dashboard - KindBite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/api-client.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>

  <header class="navbar">
    <div class="navbar-container">
      <a href="index.html"><img src="assets/logo2.png" alt="KindBite FoodTrust" class="logo" /></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="donor-dashboard.html">Donor Dashboard</a>
        <a href="nearby-donations.html">Nearby Donations</a>
        <a href="ai-insights.html">AI Insights</a>
        <a href="impact-testimonials.html">Impact</a>
        <a href="our-mission.html">Mission</a>
        <a href="about-us.html">About</a>
        <a href="contact-us.html">Contact</a>
        <a href="admin-dashboard.html">Admin</a>
        <a href="login.html" class="nav-highlight">Login</a>
      </nav>
    </div>
  </header>
  <header class="top-bar">
    <h1>🍽️ KindBite | Donor Dashboard</h1>
    <div class="notification-badges">
      <span class="badge new">New</span>
      <span class="badge alert">2 Expiring</span>
    </div>
  </header>

  <section class="stats">
    <div class="stat-card">
      <h3>Total Donations</h3>
      <p id="donationCount">0</p>
    </div>
    <div class="stat-card">
      <h3>Approved</h3>
      <p>12</p>
    </div>
    <div class="stat-card">
      <h3>Picked Up</h3>
      <p>8</p>
    </div>
  </section>

  <section class="chart">
    <canvas id="donationChart" width="300" height="300"></canvas>
  </section>

  <section class="form-section">
    <h2>Add New Donation</h2>
    <form id="donationForm">
      <input type="text" id="foodType" placeholder="Food Type" required>
      <input type="number" id="quantity" placeholder="Quantity (kg)" required>
      <input type="datetime-local" id="expiry" required>
      <button type="submit">Submit Donation</button>
    </form>
    <div id="successMessage" class="hidden">🎉 Donation added successfully!</div>
  </section>

  <section class="history">
    <h2>Donation History</h2>
    <input type="text" id="searchBar" placeholder="Search by Food Type">
    <table>
      <thead>
        <tr>
          <th>Food Type</th>
          <th>Quantity</th>
          <th>Expiry</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="historyTable">
        <!-- Rows added dynamically -->
      </tbody>
    </table>
  </section>

</body>
</html>
