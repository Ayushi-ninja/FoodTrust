<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - KindBite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>

  <header class="navbar">
    <div class="navbar-container">
      <a href="index.html"><img src="assets/logo2.png" alt="KindBite FoodTrust" class="logo" /></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="donor-dashboard.html">Donor Dashboard</a>
        <a href="nearby-donations.html">Nearby Donations</a>
        <a href="ai-insights.html">AI Insights</a>
        <a href="impact-testimonials.html">Impact</a>
        <a href="our-mission.html">Mission</a>
        <a href="about-us.html">About</a>
        <a href="contact-us.html">Contact</a>
        <a href="admin-dashboard.html">Admin</a>
        <a href="login.html" class="nav-highlight">Login</a>
      </nav>
    </div>
  </header>

  <section class="contact-wrapper">
    <div class="contact-container">
      <h1 class="contact-title">Get in Touch</h1>
      <p class="contact-subtitle">We’d love to hear from you. Whether you're a donor, NGO, or just want to say hi!</p>

      <div class="contact-form-section">
        <form class="contact-form" action="https://submit-form.com/HWrKMKqUW" method="POST">
          <input type="text" placeholder="Your Name" required />
          <input type="email" placeholder="Your Email" required />
          <input type="text" placeholder="Subject" required />
          <textarea placeholder="Your Message" rows="5" required></textarea>
          <button type="submit">Send Message</button>
        </form>

        <div class="contact-details">
          <h3>Contact Information</h3>
          <p><strong>Email:</strong> hello@kindbite.org</p>
          <p><strong>Phone:</strong> +91 98765 43210</p>
          <p><strong>Address:</strong> 101 KindBite HQ, Delhi, India</p>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
